name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Diagnose window presentation on macOS 15
        run: |
          ruby -e '
            source = File.read("tests/WindowPresentationTests.swift")
            original = %q{  precondition(shown.last === sticky && coordinator.selected == .sticky)}
            diagnostic = %q{
              print("after 20 ms: shown=\(shown.last === sticky), selected=\(String(describing: coordinator.selected))")
              fflush(stdout)
              let deadline = Date().addingTimeInterval(2)
              while shown.last !== sticky && Date() < deadline {
                RunLoop.main.run(until: Date().addingTimeInterval(0.05))
              }
              print("after waiting: shown=\(shown.last === sticky), selected=\(String(describing: coordinator.selected))")
              fflush(stdout)
              precondition(shown.last === sticky && coordinator.selected == .sticky)
            }
            abort "diagnostic target not found" unless source.include?(original)
            File.write(ARGV[0], source.sub(original, diagnostic))
          ' "$RUNNER_TEMP/WindowPresentationDiagnostic.swift"
          xcrun swiftc -parse-as-library -Onone -framework SwiftUI -framework AppKit \
            macos/WindowPresentation.swift "$RUNNER_TEMP/WindowPresentationDiagnostic.swift" \
            -o "$RUNNER_TEMP/pulse-window-diagnostic"
          codesign --force --sign - "$RUNNER_TEMP/pulse-window-diagnostic"
          "$RUNNER_TEMP/pulse-window-diagnostic"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Node regression tests (no hardware)
        run: node --test tests/*.test.mjs
      - name: Native Swift checks
        run: python3 scripts/test_swift.py
      - name: Build app and WidgetKit extension
        run: python3 scripts/build_macos.py
      - name: Verify bundle integrity
        run: codesign --verify --deep --strict "build/Codex Pulse.app"
